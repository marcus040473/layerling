<title>Vasen-Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a workbench. The vase stands on the left in its own light; the settings run down the right as one
   column of drawers. On a phone the vase stays on top while the drawers scroll under it. */
:root {
  --bg: #eef1f4;        /* porcelain in shade */
  --surface: #ffffff;   /* glazed white */
  --stage-a: #f7f9fb;   /* light behind the vase */
  --stage-b: #dfe5ea;
  --fg: #17212c;        /* ink */
  --muted: #5b6876;
  --line: #d3dae1;
  --grid: #8894a1;
  --accent: #1d4fb4;    /* cobalt, as painted on porcelain */
  --accent-fg: #ffffff;
  --accent-soft: #e3ebfa;
  --warn: #8a5a00;
  --warn-bg: #fdf1d6;
  --critical: #c8372d;
  --info-bg: #e8edf2;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151b; --surface: #19212a; --stage-a: #26313d; --stage-b: #131a22; --fg: #e8edf2; --muted: #9aa7b5; --line: #2f3a46; --grid: #6b7887;
    --accent: #7ea6ff; --accent-fg: #0c1420; --accent-soft: #223252; --warn: #f0c56a; --warn-bg: #3a2f14; --critical: #ff6b5e; --info-bg: #222c37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #19212a; --stage-a: #26313d; --stage-b: #131a22; --fg: #e8edf2; --muted: #9aa7b5; --line: #2f3a46; --grid: #6b7887;
  --accent: #7ea6ff; --accent-fg: #0c1420; --accent-soft: #223252; --warn: #f0c56a; --warn-bg: #3a2f14; --critical: #ff6b5e; --info-bg: #222c37;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
.app {
  height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 372px; grid-template-rows: auto minmax(0, 1fr); gap: 12px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar h1 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.bar-actions { display: flex; gap: 8px; }
.stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.view-box { position: relative; flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; background: radial-gradient(120% 90% at 50% 30%, var(--stage-a), var(--stage-b)); border: 1px solid var(--line); }
#view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }
#no-webgl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
.readout { display: flex; flex-wrap: wrap; gap: 6px 18px; font-variant-numeric: tabular-nums; }
.figure { display: flex; flex-direction: column; min-width: 0; }
.figure-label { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.figure-value { font-family: var(--display); font-size: 15px; font-weight: 500; }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 30%; overflow-y: auto; }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border-radius: 8px; background: var(--info-bg); font-size: 13px; }
.note-warn { background: var(--warn-bg); color: var(--warn); }
.note-mark { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; border: 1.5px solid currentColor; }
.panel { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; overscroll-behavior: contain; }
.presets, .group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.presets { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.presets h2 { margin: 0; font-family: var(--display); font-size: 14px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 999px; }
.chip-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); }
.group > summary { list-style: none; cursor: pointer; padding: 11px 12px; display: flex; align-items: center; justify-content: space-between; font-family: var(--display); font-size: 14px; font-weight: 600; border-radius: 12px; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary::after { content: "+"; color: var(--muted); font-weight: 500; margin-left: auto; padding-left: 10px; }
.group[open] > summary::after { content: "–"; }
.count { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; text-align: center; margin-left: 8px; }
.group-body { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 9px; }
.row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 86px; align-items: center; gap: 8px; }
.row > label, .row > .label { color: var(--muted); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.row-select { grid-template-columns: 104px minmax(0, 1fr); }
.row-toggle { grid-template-columns: auto minmax(0, 1fr); }
.row-toggle > label { color: var(--fg); }
.number-box { display: flex; align-items: center; gap: 4px; min-width: 0; }
.unit { color: var(--muted); font-size: 12px; flex: none; }
input, select, textarea, button { font: inherit; color: inherit; }
input[type="range"] { width: 100%; min-width: 0; accent-color: var(--accent); }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.number, select, input[type="text"], textarea { width: 100%; min-width: 0; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font-variant-numeric: tabular-nums; }
.number { text-align: right; }
.file { min-width: 0; max-width: 100%; font-size: 12px; }
textarea { resize: vertical; font-size: 12px; }
button { cursor: pointer; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
button.ghost { background: transparent; }
button.add { border-style: dashed; color: var(--accent); background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.button-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { margin: 0; color: var(--muted); font-size: 12px; }
.layer { display: flex; flex-direction: column; gap: 9px; padding: 10px; border-radius: 10px; background: var(--bg); }
.layer .number, .layer select, .layer input[type="text"] { background: var(--surface); }
.layer-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.profile-box { display: flex; flex-direction: column; gap: 8px; }
.profile { width: 100%; max-width: 100%; aspect-ratio: 600 / 520; border-radius: 10px; background: var(--bg); touch-action: none; cursor: crosshair; }
.settings-box { display: flex; flex-direction: column; gap: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 1px solid var(--line); }
.swatch.is-on { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  /* The vase stays in sight while the figures and the drawers scroll under it. */
  .stage { display: contents; }
  .view-box { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 2; flex: none; height: 40vh; min-height: 230px; box-shadow: 0 -20px 0 12px var(--bg); }
  .notes { max-height: none; }
  .panel { overflow: visible; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
<div class="app">
  <header class="bar">
    <h1 id="app-title">Vasen-Generator</h1>
    <div class="bar-actions">
      <button type="button" class="ghost" id="reset-view">Ansicht</button>
      <button type="button" class="ghost" id="language" aria-label="Sprache / Language">EN</button>
    </div>
  </header>
  <main class="stage">
    <div class="view-box">
      <canvas id="view" aria-label="Vase"></canvas>
      <div id="no-webgl" hidden></div>
    </div>
    <div class="readout" id="readout" aria-live="off"></div>
    <ul class="notes" id="notes"></ul>
  </main>
  <aside class="panel" id="panel"></aside>
</div>
<script>/*APP*/</script>
